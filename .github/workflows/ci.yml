name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One in-flight run per ref; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Gradle daemon is pinned to a JetBrains-vendor JDK 21
      # (gradle/gradle-daemon-jvm.properties). Install JBR 21 so daemon toolchain
      # detection has a matching JVM; JAVA_HOME then points at it.
      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      # Static analysis runs before the build: ktlint and detekt need no compiled classpath, so a
      # style or code-smell failure is reported in seconds rather than after a full assemble.
      # verifyDocMap joins them for the same reason — it only reads CLAUDE.md and the source tree.
      - name: Static analysis (ktlint + detekt) and doc map
        run: >-
          ./gradlew --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          staticAnalysis :app:verifyDocMap

      # Android SDK (platform/build-tools for compileSdk 36) is preinstalled on the
      # ubuntu-latest runner and exposed via ANDROID_HOME/ANDROID_SDK_ROOT.
      # verifyLicenseCoverage resolves the release runtime classpath, so it runs here rather than
      # with the static analysis above — that step is kept free of dependency resolution.
      - name: Run unit tests, verify licence coverage, assemble debug APK
        run: >-
          ./gradlew --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          :app:testDebugUnitTest :app:verifyLicenseCoverage :app:assembleDebug

      # Android lint catches what ktlint and detekt structurally cannot: manifest and resource
      # problems, and AndroidX's own @RequiresOptIn markers, which the Kotlin compiler never
      # enforces because they are declared Java-side. It needs a compiled classpath, so it runs
      # last rather than with staticAnalysis.
      - name: Android lint
        run: >-
          ./gradlew --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          :app:lintDebug

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload static analysis reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/detekt
            app/build/reports/ktlint
          if-no-files-found: ignore
