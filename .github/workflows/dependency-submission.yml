name: Dependency submission

# Gradle dependencies cannot be read from the build scripts, so GitHub's dependency graph (and the
# Dependabot alerts drawn from it) sees them only when a build submits them. This resolves the
# release runtime classpath — what ships in the APK — and submits it. Alerts read the default
# branch's submission; a version branch's run checks the workflow before it reaches main.
on:
  push:
    branches: [ main, 'v[0-9]*' ]
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      # The Dependency Submission API takes a write token; nothing else in this job writes.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The same JetBrains Runtime 21 as ci.yml, which gradle/gradle-daemon-jvm.properties requires.
      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jetbrains
          java-version: '21'

      # Configuring the Android build needs the compileSdk platform, as in ci.yml.
      - name: Install the compileSdk platform
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      # v5 rather than v6: v6 moves caching into a proprietary component under Gradle's Terms of
      # Use, while v5 is MIT throughout.
      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          additional-arguments: -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME }}
