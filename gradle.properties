# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Runs :app and :shared tasks side by side, and reuses task outputs across invocations (CI makes four).
# The configuration cache stays off: verifyDocMap, verifyLicenseCoverage and verifyMergedManifest
# capture the Project at execution time, which it cannot serialize.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App version — single source of truth (read by android/build.gradle.kts).
# VERSION_CODE: integer Play orders builds by; must be strictly higher than any code already
#   uploaded, app-wide (users never see it). Scheme: YYYYMMDD of the release day, set manually.
#   One uploadable build per day — for a rare same-day rebuild, just +1 (borrow the next day) or
#   append a 2-digit counter (YYYYMMDDNN). Never decrease it.
# VERSION_NAME: the user-facing label. Use SemVer MAJOR.MINOR.PATCH; bump when it's meaningful.
# CI/local override without editing this file: -PVERSION_CODE=20260101 -PVERSION_NAME=1.2.3
VERSION_CODE=20261112
VERSION_NAME=4.1
