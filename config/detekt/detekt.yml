# Overrides layered on top of detekt's shipped defaults (buildUponDefaultConfig = true in the root
# build script). Only rules that differ from the default are listed here; everything omitted keeps
# detekt's own setting. Formatting is ktlint's job — no rule here duplicates a ktlint check.

build:
  # Any finding fails the build. There is deliberately no baseline file: a baseline converts a
  # finding into permanent, invisible debt. A new finding gets a real fix, or a site-level
  # @Suppress carrying the reason.
  maxIssues: 0

complexity:
  LongMethod:
    # Composables are declarative trees, not branching logic — length there is layout, not
    # complexity, and splitting one to satisfy a line count makes it harder to read.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    # A Composable's parameters are its API surface (state in, callbacks out).
    ignoreAnnotated: ['Composable', 'Preview']
    # DI is manual here (AppContainer, no framework), so a collaborator count is exactly what a
    # constructor's parameter list is. Splitting one to satisfy a threshold hides the dependency.
    constructorThreshold: 8
    # Test builders take one parameter per axis they vary; that is the point of a builder.
    excludes: ['**/test/**', '**/androidTest/**']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    # A DAO is a query surface: each function is one statement, and merging two to drop the count
    # would mean a query that does more than one thing.
    thresholdInInterfaces: 20
    ignoreAnnotatedFunctions: ['Composable', 'Preview']
    ignorePrivate: true
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    # Catching broad exceptions is load-bearing in a few seams — a refused foreground start must
    # never take the running session down, and a watchdog revive runs on a scope with no handler.
    # Those sites carry a site-level @Suppress naming the reason; a new one needs the same
    # justification.
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'ActivityNotFoundException'
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'SecurityException'

naming:
  FunctionNaming:
    # Composables are PascalCase by convention (see CLAUDE.md).
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    # dp/sp sizes, weights, alphas and percentage thresholds read worse as named constants.
    ignoreAnnotated: ['Composable', 'Preview']
    ignoreNumbers: ['-1', '0', '1', '2', '100']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
  MaxLineLength:
    # ktlint owns line length (max_line_length in .editorconfig); reporting it twice is noise.
    active: false
  UnusedPrivateMember:
    active: true
    # @Preview functions are invoked by the IDE/tooling, never by app code.
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'PreviewScreenSizes']
  ForbiddenComment:
    # Only colon-suffixed markers are flagged, so prose containing the bare word is left alone.
    comments:
      - reason: 'Unresolved work marker left in the source.'
        value: 'TODO:'
      - reason: 'Unresolved work marker left in the source.'
        value: 'FIXME:'
      - reason: 'Must not ship.'
        value: 'STOPSHIP:'
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
  ForbiddenImport:
    # Spark components that break a product rule in CLAUDE.md, and Spark-bundled machinery whose
    # manifest entries are removed. A ban is by package, so it holds for every component a later
    # Spark release adds there; re-check the package names on any Spark bump. `*` spans
    # subpackages (progress.tracker, meter.circular). A wildcard import of a banned package is not
    # matched here; WildcardImport (detekt's default) and ktlint refuse it instead. A fully qualified
    # name with no import is seen by neither.
    active: true
    imports:
      - value: 'com.adevinta.spark.components.progress.*'
        reason: 'Hours have no direction: no gauge, meter, progress or tracker. Includes Spinner.'
      - value: 'com.adevinta.spark.components.progressbar.*'
        reason: 'Hours have no direction: no gauge, meter, progress or tracker.'
      - value: 'com.adevinta.spark.components.gauge.*'
        reason: 'Hours have no direction: no gauge, meter, progress or tracker.'
      - value: 'com.adevinta.spark.components.meter.*'
        reason: 'Hours have no direction: no gauge, meter, progress or tracker.'
      - value: 'com.adevinta.spark.components.rating.*'
        reason: 'Grades a day or a habit.'
      - value: 'com.adevinta.spark.components.badge.*'
        reason: 'A count per habit ranks habits.'
      - value: 'com.adevinta.spark.components.stepper.*'
        reason: 'Nothing in the app takes a number; a stepper invites a target.'
      - value: 'com.adevinta.spark.components.slider.*'
        reason: 'Nothing in the app takes a number; a slider invites a target.'
      - value: 'com.adevinta.spark.components.fileupload.*'
        reason: "FileKit's provider and initializer are removed from the manifest."
      - value: 'com.adevinta.spark.components.image.*'
        reason: 'Coil-backed; the app loads no images.'
      - value: 'org.jetbrains.compose.resources.*'
        reason: 'AndroidContextProvider is removed from the manifest, so a Compose Resources read throws.'
